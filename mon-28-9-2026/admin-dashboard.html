<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Dashboard</title>

<link
    rel="stylesheet"
    href="assets/css/admin-dashboard.css"
>


</head>

<body>


<!-- ==========================================
     HEADER
=========================================== -->

<header class="header">

    <div class="header-left">

        <h1>Admin Dashboard</h1>

    </div>


    <div class="header-right">

        <span id="adminName">
            Admin
        </span>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</header>



<!-- ==========================================
     MAIN
=========================================== -->

<main class="container">


    <!-- ======================================
         ADD USER
    ======================================= -->

    <section class="card">

        <div class="card-header">

            <h2>Add User</h2>

            <p>
                Create a new user account
            </p>

        </div>


        <form id="addUserForm">


            <!-- Name -->

            <div class="form-group">

                <label for="userName">
                    Name
                </label>

                <input
                    type="text"
                    id="userName"
                    placeholder="Enter name"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="userEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="userEmail"
                    placeholder="Enter email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="userPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="userPassword"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- Role -->

            <div class="form-group">

                <label for="userRole">
                    Role
                </label>

                <select id="userRole">

                    <option value="user">
                        User
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="add-btn"
            >
                Add User
            </button>

        </form>

    </section>



    <!-- ======================================
         USERS
    ======================================= -->

    <section class="card">

        <div class="card-header">

            <h2>Registered Users</h2>

            <p>
                All users registered in the system
            </p>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Role</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="usersTable">

                    <!-- Users will be added here -->

                </tbody>

            </table>

        </div>

    </section>


</main>


<script src="assets/js/admin-dashboard.js"></script>


</body>

</html>
